name: Playgama Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-playgama-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build and validate Playgama release
        run: npm run build:playgama

      - name: Package Playgama ZIP with index.html at archive root
        run: |
          cd dist
          zip -r ../meme-hub-v2.0.zip .
          cd ..
          unzip -l meme-hub-v2.0.zip | head -100

      - name: Upload Playgama package
        uses: actions/upload-artifact@v4
        with:
          name: meme-hub-v2.0-playgama-${{ github.sha }}
          path: meme-hub-v2.0.zip
          if-no-files-found: error
          retention-days: 30
