<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Meme Lab V 1.0</title>
    <meta name="description" content="Meme Lab V 1.0 — Разработано командой 3R Games. Браузерная 2D игра в жанре merge & idle simulator, где игроки комбинируют животных, фрукты и предметы для создания абсурдных мемов-существ." />
    <meta property="og:title" content="Meme Lab V 1.0" />
    <meta property="og:description" content="Meme Lab V 1.0 — Разработано командой 3R Games. Браузерная 2D игра в жанре merge & idle simulator, где игроки комбинируют животных, фрукты и предметы для создания абсурдных мемов-существ." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html,
      body {
        background: #020617;
      }

      body,
      button,
      input,
      textarea,
      select {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      img,
      svg {
        -webkit-user-drag: none;
        user-select: none;
      }
    </style>

    <!-- Yandex Games SDK. Archive builds hosted by Yandex must use /sdk.js. -->
    <script src="/sdk.js"></script>
    <script>
      // Explicit bootstrap follows the official Yandex Games integration example.
      // Keeping YaGames.init() visible in index.html also makes automated SDK checks reliable.
      if (typeof YaGames !== 'undefined') {
        YaGames.init()
          .then(function (ysdk) {
            window.ysdk = ysdk;
            console.log('[Yandex SDK] Bootstrap initialized from index.html.');
          })
          .catch(function (error) {
            console.error('[Yandex SDK] Bootstrap initialization failed:', error);
          });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 select-none overflow-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
