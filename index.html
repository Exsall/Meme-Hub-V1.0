<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Meme Hub V2.0</title>
    <meta name="description" content="Meme Hub V2.0 — браузерная 2D merge & idle игра от команды G3R." />
    <meta property="og:title" content="Meme Hub V2.0" />
    <meta property="og:description" content="Создавай мемных существ, развивай лабораторию и открывай новые зоны в Meme Hub V2.0." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html,
      body {
        background: #020617;
      }

      body,
      button,
      input,
      textarea,
      select {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      img,
      svg {
        -webkit-user-drag: none;
        user-select: none;
      }
    </style>

    <!-- Playgama Bridge v2. The stable CDN loads the adapter for the current platform. -->
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <script>
      if (window.bridge) {
        window.bridge.gameVersion = '2.0';
        window.playgamaBridgePromise = window.bridge
          .initialize()
          .then(function () {
            var platformLanguage = String(window.bridge.platform.language || 'ru').toLowerCase();
            document.documentElement.lang = 'ru';
            document.documentElement.dataset.platformLanguage = platformLanguage;
            console.log(
              '[Playgama Bridge] Bootstrap initialized. Platform:',
              window.bridge.platform.id,
              'Language:',
              platformLanguage,
            );
            return window.bridge;
          })
          .catch(function (error) {
            console.warn('[Playgama Bridge] Bootstrap initialization failed:', error);
            return null;
          });
      } else {
        console.warn('[Playgama Bridge] SDK script is unavailable. Running in standalone preview mode.');
        window.playgamaBridgePromise = Promise.resolve(null);
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 select-none overflow-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
