<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Meme Lab V 1.0</title>
    <meta name="description" content="Meme Lab V 1.0 — Разработано командой 3R Games. Браузерная 2D игра в жанре merge & idle simulator, где игроки комбинируют животных, фрукты и предметы для создания абсурдных мемов-существ." />
    <meta property="og:title" content="Meme Lab V 1.0" />
    <meta property="og:description" content="Meme Lab V 1.0 — Разработано командой 3R Games. Браузерная 2D игра в жанре merge & idle simulator, где игроки комбинируют животных, фрукты и предметы для создания абсурдных мемов-существ." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html,
      body {
        background: #020617;
      }

      body,
      button,
      input,
      textarea,
      select {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      img,
      svg {
        -webkit-user-drag: none;
        user-select: none;
      }
    </style>

    <!-- Yandex Games SDK. Archive builds hosted by Yandex must use /sdk.js. -->
    <script src="/sdk.js"></script>
    <script>
      // Initialize Yandex SDK at startup and read environment.i18n.lang immediately.
      // Requirement 2.14 requires SDK-based language detection during game launch,
      // even when the game currently declares only one supported language.
      if (typeof YaGames !== 'undefined') {
        window.yandexSdkPromise = YaGames.init()
          .then(function (ysdk) {
            window.ysdk = ysdk;

            // IMPORTANT: this access is what Yandex debug/moderation uses to verify I18N.
            var platformLanguage = ysdk.environment.i18n.lang;
            window.__YANDEX_LANGUAGE__ = String(platformLanguage || 'ru').toLowerCase();

            // Meme Lab currently ships Russian UI only, so unsupported portal languages
            // fall back to Russian while the original SDK language remains recorded.
            document.documentElement.lang = 'ru';
            document.documentElement.dataset.platformLanguage = window.__YANDEX_LANGUAGE__;

            console.log(
              '[Yandex SDK] Bootstrap initialized. Platform language:',
              window.__YANDEX_LANGUAGE__,
              'Active game language: ru',
            );
            return ysdk;
          })
          .catch(function (error) {
            console.error('[Yandex SDK] Bootstrap initialization failed:', error);
            return null;
          });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 select-none overflow-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
